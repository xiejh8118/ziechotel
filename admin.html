<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b1c33" />
    <link rel="stylesheet" href="./styles.css" />
    <title>平台后台 | ZIEC</title>
    <meta name="robots" content="noindex,nofollow" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="./index.html"
          ><img src="./assets/logo.png" alt="ZIEC Logo" /><span
            ><strong>ZIEC HOTEL</strong
            ><small>中鼎国际酒店 · 供应链平台</small></span
          ></a
        ><button class="menu-toggle" type="button" aria-label="打开菜单">
          <span></span><span></span><span></span>
        </button>
        <nav class="nav-links">
          <a href="./index.html">首页</a
          ><a href="./index.html#hotel-stay">酒店住宿</a
          ><a href="./index.html#corporate">企业服务</a
          ><a href="./suppliers.html">供应链平台</a
          ><a href="./index.html#contact">联系我们</a
          ><button class="nav-ai" type="button" data-ai-open>AI 客服</button
          ><a
            class="nav-cta"
            href="https://wa.me/855189958899"
            target="_blank"
            rel="noopener"
            >WhatsApp 咨询</a
          >
        </nav>
      </div>
    </header>
    <main>
      <section class="sub-hero admin-hero">
        <div class="container">
          <span>ADMIN</span>
          <h1>ZIEC 平台管理后台</h1>
          <p>供应商、酒店房源、采购询价与 AI 客服统一管理。</p>
        </div>
      </section>
      <section class="section">
        <div class="container">
          <form class="admin-login" id="adminLogin">
            <h2>管理员登录</h2>
            <label
              >管理员密码<input
                type="password"
                name="password"
                required /></label
            ><button class="btn btn-dark">登录</button>
            <div id="adminLoginMessage" class="form-message"></div>
          </form>
          <div id="adminDashboard" hidden>
            <div class="admin-tabs">
              <button data-tab="suppliers" class="active">供应商审核</button
              ><button data-tab="hotels">酒店管理</button
              ><button data-tab="bookings">在线订单</button
              ><button data-tab="inquiries">采购询价</button
              ><button data-tab="ai-settings">AI 客服设置</button
              ><button id="adminLogout">退出登录</button>
            </div>
            <div id="adminContent" class="admin-list"></div>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="container footer-wrap">
        <div class="footer-brand">
          <img src="./assets/logo.png" alt="ZIEC" /><span
            ><strong>ZIEC HOTEL</strong
            ><small>中鼎国际酒店 · 供应链平台</small></span
          >
        </div>
        <div>© 2026 ZIEC · www.ziechotel.top</div>
      </div>
    </footer>
    <a class="floating-wa" href="https://wa.me/855189958899" target="_blank"
      >WA</a
    >
    <section class="ai-panel" id="aiPanel" aria-hidden="true">
      <div class="ai-head">
        <div>
          <strong>中鼎 AI 客服</strong
          ><small>酒店住宿 · 企业服务 · 供应链咨询</small>
        </div>
        <button type="button" data-ai-close aria-label="关闭">×</button>
      </div>
      <div class="ai-messages" id="aiMessages">
        <div class="ai-message bot">
          您好，我是中鼎 AI
          客服。您可以咨询客房、月租公寓、企业住宿、供应商入驻或采购询价。
        </div>
      </div>
      <div class="ai-quick">
        <button data-ai-question="酒店客房多少钱？">客房价格</button
        ><button data-ai-question="如何申请供应商入驻？">供应商入驻</button
        ><button data-ai-question="如何发布采购询价？">采购询价</button>
      </div>
      <form class="ai-form" id="aiForm">
        <input
          id="aiInput"
          maxlength="500"
          placeholder="请输入您的问题…"
          required
        /><button>发送</button>
      </form>
      <a
        class="ai-human"
        href="https://wa.me/855189958899"
        target="_blank"
        rel="noopener"
        >转 WhatsApp 人工服务</a
      >
    </section>
    <button
      class="floating-ai"
      type="button"
      data-ai-open
      aria-label="打开AI客服"
    >
      AI
    </button>
    <div class="toast"></div>
    <script src="./script.js"></script>
  </body>
</html>
